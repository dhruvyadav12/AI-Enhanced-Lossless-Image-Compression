services:
  - type: web
    name: ai-lossless-image-compression
    env: python
    plan: free
    buildCommand: "apt-get update && apt-get install -y build-essential g++ make && make && pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt"
    startCommand: "python app.py"
    envVars:
      - key: PORT
        value: 10000
